# /etc/nginx/sites-available/odii.intelsof.com
#
# Reverse proxy for the ODII backend.
#   https://odii.intelsof.com/        -> gunicorn  127.0.0.1:8001  (REST API)
#   wss://odii.intelsof.com/ws/       -> daphne    127.0.0.1:8002  (chat)
#
# NOTE: no /static/ block. Your Django project already has WhiteNoise in
# MIDDLEWARE, and STATIC_ROOT lives under /root/ which is mode 0700 - nginx
# runs as www-data and would 403 on every static file. Let WhiteNoise serve
# them through gunicorn instead. Do not add an alias to /root/... here.

server {
    listen 80;
    listen [::]:80;
    server_name odii.intelsof.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name odii.intelsof.com;

    # certbot --nginx will insert ssl_certificate / ssl_certificate_key here
    # for /etc/letsencrypt/live/odii.intelsof.com/

    # iOS ATS requires TLS 1.2+, forward secrecy and SHA-256.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Driver NIN / licence / profile-image uploads are multipart.
    client_max_body_size 25M;
    client_body_timeout 120s;

    access_log /var/log/nginx/odii-access.log;
    error_log  /var/log/nginx/odii-error.log;

    # --- websockets: chat/routing.py -> ws/chat/<room_id>/ ---
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ---
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required. Without it Django sees http and SECURE_SSL_REDIRECT loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
