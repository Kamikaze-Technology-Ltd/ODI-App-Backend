# STAGE 2 - final hardened vhost for odii.intelsof.com
# Verified against nginx/1.24.0 (Ubuntu) on server1.intelsof.com.
#
#   https://odii.intelsof.com/     -> gunicorn 127.0.0.1:8001  (REST API)
#   wss://odii.intelsof.com/ws/    -> daphne   127.0.0.1:8002  (chat)
#
# NOTES ON TWO EARLIER MISTAKES, both fixed here:
#
# 1. 'http2 on;' requires nginx >= 1.25.1. This box is 1.24.0, so the only
#    valid form is 'listen 443 ssl http2;'.
#
# 2. TLS policy comes ONLY from certbot's options-ssl-nginx.conf include.
#    That file already sets 'ssl_protocols TLSv1.2 TLSv1.3;'. Declaring
#    ssl_protocols again in this same server block would be a duplicate
#    directive and nginx would refuse to start. Do not re-add it.
#    ssl_dhparam is also intentionally absent: the certificate is ECDSA so
#    ECDHE is used, DHE parameters are never consulted, and referencing a
#    missing file would be another hard failure.
#
# The EXACT server_name below outranks the *.intelsof.com wildcard on the
# invest-frontend vhost, so this file owns odii.intelsof.com. invest-frontend
# keeps intelsof.com / www.intelsof.com / every other subdomain.
#
# No /static/ block: STATIC_ROOT lives under /root (mode 0700) and nginx runs
# as www-data, so it would 403. WhiteNoise serves static via gunicorn.

server {
    listen 80;
    listen [::]:80;
    server_name odii.intelsof.com;

    # Keep this reachable over plain HTTP or future renewals fail.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odii.intelsof.com;

    # Dedicated cert, expires 2026-12-05. Deliberately NOT the
    # *.intelsof.com wildcard, which expires 2026-09-24.
    ssl_certificate     /etc/letsencrypt/live/odii.intelsof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odii.intelsof.com/privkey.pem;

    # Supplies ssl_protocols (TLS 1.2 + 1.3), ciphers and session settings.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Driver NIN / licence / profile-image uploads are multipart.
    client_max_body_size 25M;
    client_body_timeout 120s;

    access_log /var/log/nginx/odii-access.log;
    error_log  /var/log/nginx/odii-error.log;

    # websockets: chat/routing.py -> ws/chat/<room_id>/
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required. Without it Django sees http and SECURE_SSL_REDIRECT loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
