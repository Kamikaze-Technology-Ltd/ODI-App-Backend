# STAGE 2 - final hardened vhost for odii.intelsof.com
#
# FIXED: 'http2 on;' is nginx >= 1.25.1 only and your build rejected it.
# Reverted to the universally supported form: listen 443 ssl http2;
#
#   https://odii.intelsof.com/     -> gunicorn 127.0.0.1:8001  (REST API)
#   wss://odii.intelsof.com/ws/    -> daphne   127.0.0.1:8002  (chat)
#
# The EXACT server_name below outranks the *.intelsof.com wildcard on the
# invest-frontend vhost, so this file owns odii.intelsof.com.
# invest-frontend keeps intelsof.com / www.intelsof.com / other subdomains.
#
# No /static/ block: STATIC_ROOT is under /root (0700), nginx is www-data.
# WhiteNoise serves static through gunicorn instead.

server {
    listen 80;
    listen [::]:80;
    server_name odii.intelsof.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odii.intelsof.com;

    # Dedicated cert. Deliberately NOT the *.intelsof.com wildcard, which
    # expires 2026-09-24 and is not auto-renewing.
    ssl_certificate     /etc/letsencrypt/live/odii.intelsof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odii.intelsof.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # iOS ATS: TLS 1.2+, forward secrecy, SHA-256.
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Driver NIN / licence / profile-image uploads are multipart.
    client_max_body_size 25M;
    client_body_timeout 120s;

    access_log /var/log/nginx/odii-access.log;
    error_log  /var/log/nginx/odii-error.log;

    # websockets: chat/routing.py -> ws/chat/<room_id>/
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: without it Django sees http and SECURE_SSL_REDIRECT loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
