# STAGE 1 - HTTP only. Installed first so certbot has something to work with.
#
# WHY TWO STAGES: nginx refuses to load a `listen 443 ssl` block that has no
# ssl_certificate. The cert for odii.intelsof.com does not exist yet, so a
# full HTTPS vhost would fail `nginx -t` and we would never reach certbot.
# certbot --nginx reads THIS file, generates the 443 block itself, and points
# it at the new cert. Stage 2 then replaces it with the hardened version.
#
# NAME MATCHING: the existing `invest-frontend` vhost claims
#   server_name intelsof.com www.intelsof.com *.intelsof.com;
# That wildcard currently answers for odii.intelsof.com. nginx always prefers
# an EXACT server_name over a leading-wildcard, so the exact name below takes
# priority as soon as it is enabled. No change to invest-frontend is needed.

server {
    listen 80;
    listen [::]:80;
    server_name odii.intelsof.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
